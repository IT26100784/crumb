<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order management · Crumb</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .order-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding-bottom:60px}
    .order-panel{padding:24px;align-self:start}.order-panel h3{margin-bottom:16px}
    .order-list{display:grid;gap:16px}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .order-heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .order-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
    .order-details dt{color:var(--mute)}.order-details dd{margin:0;overflow-wrap:anywhere}
    #order-message{min-height:28px;margin-bottom:16px}#order-search{min-width:0;flex:1}
    @media(max-width:800px){.order-layout{grid-template-columns:1fr}}
  </style>
  <script src="js/orders.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="ph"><a href="index.html">← Crumb home</a><h2>Order management</h2><p>Create orders and follow their progress from confirmation to completion.</p></div>
  <p id="order-message" role="status" aria-live="polite"></p>
  <div class="order-layout">
    <section class="glass order-panel">
      <h3 id="form-title">Create an order</h3>
      <form id="new-order">
        <label>Customer ID<input name="customerId" required maxlength="50"></label>
        <label>Required date<input name="requiredDate" type="date" required></label>
        <label>Agreed total (LKR)<input name="totalAmount" type="number" min="0.01" step="0.01" required></label>
        <label>Special note<textarea name="specialNote" maxlength="255"></textarea></label>
        <button class="btn" type="submit">Create order</button>
        <button class="btn ghost" type="button" id="cancel-edit" hidden>Cancel editing</button>
      </form>
    </section>
    <section aria-label="Orders">
      <div class="tool">
        <input id="order-search" type="search" placeholder="Order code or customer ID" aria-label="Search orders">
        <select id="order-status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>PENDING</option><option>CONFIRMED</option><option>IN_PROGRESS</option>
          <option>READY</option><option>COMPLETED</option><option>CANCELLED</option>
        </select>
        <button id="refresh-orders" class="btn ghost" type="button">Refresh</button>
      </div>
      <div id="order-list" class="order-list" aria-live="polite"></div>
    </section>
  </div>
</main>
</body>
</html>
